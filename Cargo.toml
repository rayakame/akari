[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
license = "MIT"
publish = false

[workspace.dependencies]
akari-core = { path = "crates/akari-core" }
akari-markdown = { path = "crates/akari-markdown" }

tokio = { version = "1.53", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
# No public feature enables rustls without a root store. The native roots stay unused:
# the core passes its own ClientConfig built with rustls-platform-verifier.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
rustls-platform-verifier = "0.7"
# The same aws-lc-rs build rustls uses; remote auth needs its RSA-OAEP directly.
aws-lc-rs = { version = "1.18", default-features = false, features = ["aws-lc-sys"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-util = { version = "0.7", default-features = false }
base64 = "0.23"
zeroize = "1.9"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
time = { version = "0.3", default-features = false, features = ["std", "parsing"] }
# Default features add a legacy-format decoder and a dictionary builder Akari doesn't need.
zstd = { version = "0.14", default-features = false }
uniffi = "0.32"
thiserror = "2"
tracing = "0.1"
wiremock = "0.6"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
