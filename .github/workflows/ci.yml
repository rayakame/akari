name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Without a toolchain argument, rustup installs the one pinned in rust-toolchain.toml.
      - run: rustup toolchain install --no-self-update
      - run: cargo fmt --all --check

  clippy-test:
    name: clippy + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Built alone, akari-core has no dev features; akari-cli turns them on in workspace builds.
      - run: cargo clippy -p akari-core --all-targets --locked -- -D warnings
      # Apps build akari-ffi alone (-p), where workspace feature unification can't add dev features.
      # Its own dev-dependencies (tests) may use insecure-test-endpoints; the library may not.
      - name: akari-ffi builds without dev features
        # A failing cargo tree must fail the step, not leave grep with nothing to find.
        run: |
          tree=$(cargo tree -p akari-ffi -e features,no-dev -i akari-core --locked)
          if grep -qE 'feature "(capture|flags-only|repeat-nonce|insecure-test-endpoints)"' <<<"$tree"; then
            echo "akari-ffi would build akari-core with a dev feature" >&2
            exit 1
          fi
      - run: cargo test --workspace --locked

  ios:
    name: check aarch64-apple-ios
    # aws-lc-sys needs the Apple SDK, which only macOS runners have.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2
      # akari-bindgen is a host tool; it never runs on a device.
      - run: cargo check --workspace --exclude akari-cli --exclude akari-bindgen --target aarch64-apple-ios --locked

  android:
    name: check aarch64-linux-android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk@4.1.2
      # cargo-ndk finds the runner's preinstalled NDK through ANDROID_NDK_HOME.
      - run: cargo ndk -t arm64-v8a check --workspace --exclude akari-cli --exclude akari-bindgen --locked

  apple:
    name: AkariKit (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2
      - run: xcodebuild -version && swift --version
      # Universal release build of akari-ffi, the Swift bindings and the XCFramework.
      - run: apps/apple/build-ffi.sh
      - run: swift test --package-path apps/apple/AkariKit

  macos-app:
    name: macOS app
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@v2
      - run: xcodebuild -version && swift --version
      # This runner's architecture is enough to build the app and run its tests.
      - run: apps/apple/build-ffi.sh --host-only
      # A pinned release; the checksum is GitHub's published digest for this asset.
      - name: Install XcodeGen 2.46.0
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - run: xcodegen generate --spec apps/macos/project.yml
      # A test that runs past its allowance fails and is named; a host that never exits hits the step's limit.
      - run: >-
          xcodebuild test -project apps/macos/Akari.xcodeproj -scheme Akari -destination 'platform=macOS'
          -test-timeouts-enabled YES -default-test-execution-time-allowance 60
          -maximum-test-execution-time-allowance 120
        timeout-minutes: 10
      - name: Where the test host hangs
        if: failure()
        run: |
          for pid in $(pgrep -x Akari); do sudo sample "$pid" 3; done

  fuzz:
    name: fuzz akari-markdown
    # Pull requests that change the parser; the targets and their nightly live in its fuzz crate.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Did akari-markdown change?
        id: changed
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if git diff --name-only "origin/$BASE...HEAD" | grep -q '^crates/akari-markdown/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      # The prebuilt cargo-fuzz targets musl by default, which the address sanitizer can't use;
      # libFuzzer needs its corpus directories to exist.
      - if: steps.changed.outputs.run == 'true'
        working-directory: crates/akari-markdown/fuzz
        run: |
          rustup toolchain install --no-self-update
          echo "FUZZ_TARGET=$(rustc -vV | sed -n 's/^host: //p')" >> "$GITHUB_ENV"
          mkdir -p corpus/parse corpus/source_range
      - if: steps.changed.outputs.run == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz@0.13.2
      # Two minutes per target, seeded with the corpus files, with debug assertions and overflow checks.
      - name: Fuzz parse
        if: steps.changed.outputs.run == 'true'
        working-directory: crates/akari-markdown/fuzz
        run: >-
          cargo fuzz run parse -O -a --target "$FUZZ_TARGET" corpus/parse ../tests/corpus
          -- -max_total_time=120 -max_len=8192
      - name: Fuzz source_range
        if: ${{ !cancelled() && steps.changed.outputs.run == 'true' }}
        working-directory: crates/akari-markdown/fuzz
        run: >-
          cargo fuzz run source_range -O -a --target "$FUZZ_TARGET" corpus/source_range ../tests/corpus
          -- -max_total_time=120 -max_len=8192
      - if: ${{ failure() && steps.changed.outputs.run == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: crates/akari-markdown/fuzz/artifacts/
          if-no-files-found: ignore

  deny:
    name: cargo-deny bans
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The action installs the toolchain from rust-toolchain.toml on its own.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans
