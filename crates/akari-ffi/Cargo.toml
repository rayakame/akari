[package]
name = "akari-ffi"
description = "UniFFI bindings for Akari (Swift and Kotlin)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# Only staticlib: Cargo skips LTO when an rlib is among the outputs.
crate-type = ["staticlib"]

[dependencies]
akari-core.workspace = true
akari-markdown.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uniffi.workspace = true

[dev-dependencies]
akari-core = { workspace = true, features = ["insecure-test-endpoints"] }
futures-util.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite.workspace = true
wiremock.workspace = true

[lints]
workspace = true
