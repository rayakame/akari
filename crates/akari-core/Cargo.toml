[package]
name = "akari-core"
description = "Discord gateway, REST client, state store and SQLite cache for Akari"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aws-lc-rs.workspace = true
base64.workspace = true
futures-util.workspace = true
percent-encoding.workspace = true
reqwest = { workspace = true, features = ["json"] }
rustls.workspace = true
rustls-platform-verifier.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
tokio-tungstenite.workspace = true
tokio-util.workspace = true
tracing.workspace = true
zeroize.workspace = true
zstd.workspace = true

[features]
# Hands out the raw READY for checking the models against real traffic. Only akari-cli
# enables it; apps build with `-p akari-ffi`, so workspace feature unification can't add it.
capture = []
# Adds Account::send_message_twice, which repeats a send with the same nonce, to check that
# Discord ignores the repeat. Only akari-cli enables it, like capture.
repeat-nonce = []
# Lets Endpoints point at http:// and ws:// test servers. Only the test suites enable it.
insecure-test-endpoints = []

[dev-dependencies]
akari-core = { workspace = true, features = ["insecure-test-endpoints"] }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "test-util", "time"] }
tracing-subscriber.workspace = true
wiremock.workspace = true

[lints]
workspace = true
