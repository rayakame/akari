[package]
name = "akari-markdown-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
akari-markdown = { path = "..", features = ["fuzzing"] }

# Its own workspace: cargo-fuzz needs nightly, and the main workspace stays on stable.
[workspace]

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "source_range"
path = "fuzz_targets/source_range.rs"
test = false
doc = false
bench = false
